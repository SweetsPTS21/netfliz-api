openapi: 3.0.3
info:
  title: Swagger Netfliz - OpenAPI 3.0
  description: |-
    Netfliz API is a Spring Boot application that provides a set of RESTful endpoints to manage users, profiles, and movies.
    You can find out more about Swagger at
  termsOfService: http://swagger.io/terms/
  contact:
    email: apiteam@swagger.io
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.11
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
  - url: http://localhost:8080/api/v1/
    description: Local server
  - url: https://api.netfliz.com/api/v1/
    description: Production server
tags:
  - name: user
    description: Operations about user
  - name: profile
    description: Operations about profile
  - name: movie
    description: Operations about movie
  - name: config
    description: Operations about config
  - name: movieGenre
    description: Operations about movie genre
  - name: movieMetadata
    description: Operations about movie metadata


paths:
  /users:
    get:
      tags:
        - user
      summary: get all user
      description: Returns all user from the system that the user has access to
      operationId: getAllUser
      parameters:
        - name: page
          in: query
          description: Current page
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: pageSize
          in: query
          description: Current page
          required: false
          schema:
            type: integer
            format: int32
            default: 10
        - name: filter
          in: query
          description: filter
          schema:
            type: string
            default: null
        - name: sort
          in: query
          description: sort
          schema:
            type: string
            default: null
      responses:
        '200':
          description: A list of user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
    post:
      tags:
        - user
      summary: Create user
      description: This can only be done by the logged in user.
      operationId: createUser
      requestBody:
        description: Created user object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid user supplied
        '409':
          description: User already exists

  /users/{userId}:
    get:
      tags:
        - user
      summary: get user by id
      description: Returns a single user
      operationId: getUserById
      parameters:
        - name: userId
          in: path
          description: ID of user to return
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid ID supplied
        '404':
          description: User not found
    put:
      tags:
        - user
      summary: Updated user
      description: This can only be done by the logged in user.
      operationId: updateUser
      parameters:
        - name: userId
          in: path
          description: ID of user to update
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: Updated user object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid user supplied
        '404':
          description: User not found
    delete:
      tags:
        - user
      summary: Delete user
      description: This can only be done by the logged in user.
      operationId: deleteUser
      parameters:
        - name: userId
          in: path
          description: ID of user to delete
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '400':
          description: Invalid user supplied
        '404':
          description: User not found

  /users/login:
    get:
      tags:
        - user
      summary: Logs user into the system
      operationId: loginUser
      parameters:
        - name: username
          in: query
          description: The user name for login
          required: true
          schema:
            type: string
        - name: password
          in: query
          description: The password for login in clear text
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          headers:
            X-Rate-Limit:
              description: calls per hour allowed by the user
              schema:
                type: integer
                format: int32
            X-Expires-After:
              description: date in UTC when token expires
              schema:
                type: string
                format: date-time
        '400':
          description: Invalid username/password supplied

  /users/logout:
    get:
      tags:
        - user
      summary: Logs out current logged in user session
      operationId: logoutUser
      responses:
        default:
          description: successful operation


  /profiles:
    get:
      tags:
        - profile
      summary: get all profile
      description: Returns all profile from the system that the user has access to
      operationId: getAllProfile
      responses:
        '200':
          description: A list of profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileArray'
    post:
      tags:
        - profile
      summary: Create profile
      description: This can only be done by the logged in user.
      operationId: createProfile
      requestBody:
        description: Created profile object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Profile'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: Invalid profile supplied
        '409':
          description: Profile already exists

  /profiles/{profileId}:
    get:
      tags:
        - profile
      summary: get profile by id
      description: Returns a single profile
      operationId: getProfileById
      parameters:
        - name: profileId
          in: path
          description: ID of profile to return
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: Invalid ID supplied
        '404':
          description: Profile not found
    put:
      tags:
        - profile
      summary: Updated profile
      description: This can only be done by the logged in user.
      operationId: updateProfile
      parameters:
        - name: profileId
          in: path
          description: ID of profile to update
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: Updated profile object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Profile'
      responses:
        '400':
          description: Invalid profile supplied
        '404':
          description: Profile not found
    delete:
      tags:
        - profile
      summary: Delete profile
      description: This can only be done by the logged in user.
      operationId: deleteProfile
      parameters:
        - name: profileId
          in: path
          description: ID of profile to delete
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '400':
          description: Invalid profile supplied
        '404':
          description: Profile not found

  /users/{userId}/profiles:
    get:
      tags:
        - profile
      summary: get all profile by user id
      description: Returns all profile from the system that the user has access to
      operationId: getAllProfileByUserId
      parameters:
        - name: userId
          in: path
          description: ID of user to return profile
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: A list of profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileArray'
    post:
      tags:
        - profile
      summary: Create profile by user id
      description: This can only be done by the logged in user.
      operationId: createProfileByUserId
      parameters:
        - name: userId
          in: path
          description: ID of user to create profile
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: Created profile object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Profile'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: Invalid profile supplied
        '409':
          description: Profile already exists

  /users/{userId}/profiles/{profileId}:
    get:
      tags:
        - profile
      summary: get profile by user id and profile id
      description: Returns a single profile
      operationId: getProfileByUserIdAndProfileId
      parameters:
        - name: userId
          in: path
          description: ID of user to return profile
          required: true
          schema:
            type: integer
            format: int64
        - name: profileId
          in: path
          description: ID of profile to return
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: Invalid ID supplied
        '404':
          description: Profile not found
    put:
      tags:
        - profile
      summary: Updated profile by user id and profile id
      description: This can only be done by the logged in user.
      operationId: updateProfileByUserIdAndProfileId
      parameters:
        - name: userId
          in: path
          description: ID of user to update profile
          required: true
          schema:
            type: integer
            format: int64
        - name: profileId
          in: path
          description: ID of profile to update
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: Updated profile object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Profile'
      responses:
        '400':
          description: Invalid profile supplied
        '404':
          description: Profile not found
    delete:
      tags:
        - profile
      summary: Delete profile by user id and profile id
      description: This can only be done by the logged in user.
      operationId: deleteProfileByUserIdAndProfileId
      parameters:
        - name: userId
          in: path
          description: ID of user to delete profile
          required: true
          schema:
            type: integer
            format: int64
        - name: profileId
          in: path
          description: ID of profile to delete
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '400':
          description: Invalid profile supplied
        '404':
          description: Profile not found

  /movies:
    get:
      tags:
        - movie
      summary: get all movie
      description: Returns all movie from the system that the user has access to
      operationId: getAllMovie
      parameters:
        - name: page
          in: path
          description: page number
          schema:
            type: integer
            format: int32
        - name: pageSize
          in: path
          description: page size
          schema:
            type: integer
            format: int32
        - name: filter
          in: path
          description: filter
          schema:
            type: string
        - name: sort
          in: path
          description: sort
          schema:
            type: string
      responses:
        '200':
          description: A list of movie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoviePage'
    post:
      tags:
        - movie
      summary: Create movie
      description: This can only be done by the logged in user.
      operationId: createMovie
      requestBody:
        description: Created movie object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Movie'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        '400':
          description: Invalid movie supplied
        '409':
          description: Movie already exists

  /movies/{movieId}:
    get:
      tags:
        - movie
      summary: get movie by id
      description: Returns a single movie
      operationId: getMovieById
      parameters:
        - name: movieId
          in: path
          description: ID of movie to return
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        '400':
          description: Invalid ID supplied
        '404':
          description: Movie not found
    put:
      tags:
        - movie
      summary: Updated movie
      description: This can only be done by the logged in user.
      operationId: updateMovie
      parameters:
        - name: movieId
          in: path
          description: ID of movie to update
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: Updated movie object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Movie'
      responses:
        '400':
          description: Invalid movie supplied
        '404':
          description: Movie not found
    delete:
      tags:
        - movie
      summary: Delete movie
      description: This can only be done by the logged in user.
      operationId: deleteMovie
      parameters:
        - name: movieId
          in: path
          description: ID of movie to delete
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '400':
          description: Invalid movie supplied
        '404':
          description: Movie not found

  /configs:
    get:
      tags:
        - config
      summary: get configs
      description: Returns a list of configs
      operationId: getConfigs
      parameters:
        - name: page
          in: query
          description: page number
          schema:
            type: integer
            format: int32
            default: 0
        - name: pageSize
          in: query
          description: page size
          schema:
            type: integer
            format: int32
            default: 20
        - name: active
          in: query
          description: active
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigPage'
    post:
      tags:
        - config
      summary: create config
      description: Create a new config
      operationId: createConfig
      requestBody:
        description: Config object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Config'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'

  /configs/{id}:
    get:
      tags:
        - config
      summary: get config by id
      description: Returns config
      operationId: getConfigById
      parameters:
        - name: id
          in: path
          description: ID of config to return
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'

    put:
      tags:
        - config
      summary: update config by id
      description: Returns config
      operationId: updateConfigById
      parameters:
        - name: id
          in: path
          description: ID of config to return
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        description: Config object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Config'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'

    delete:
      tags:
        - config
      summary: delete config by id
      description: Delete config
      operationId: deleteConfigById
      parameters:
        - name: id
          in: path
          description: ID of config to return
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: boolean

  /configs/active:
    get:
      tags:
        - config
      summary: get active config
      description: Returns config
      operationId: getActiveConfig
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'

  /movie-genres:
    get:
      tags:
        - movieGenre
      summary: get all movie genres
      description: Returns movie genres
      operationId: getAllMovieGenres
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MovieGenre'

    post:
      tags:
        - movieGenre
      summary: create movie genre
      description: Create a new movie genre
      operationId: createMovieGenre
      requestBody:
        description: Movie genre object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovieGenre'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieGenre'

  /movie-genres/{id}:
    get:
      tags:
        - movieGenre
      summary: get movie genre by id
      description: Returns movie genre
      operationId: getMovieGenreById
      parameters:
        - name: id
          in: path
          description: ID of movie genre to return
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieGenre'

    put:
      tags:
        - movieGenre
      summary: update movie genre by id
      description: Returns movie genre
      operationId: updateMovieGenreById
      parameters:
        - name: id
          in: path
          description: ID of movie genre to return
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        description: Movie genre object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovieGenre'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieGenre'

    delete:
      tags:
        - movieGenre
      summary: delete movie genre by id
      description: Delete movie genre
      operationId: deleteMovieGenreById
      parameters:
        - name: id
          in: path
          description: ID of movie genre to return
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: boolean

  /movie-metadata:
    get:
      tags:
        - movieMetadata
      summary: get movie metadata
      description: Returns movie metadata
      operationId: getMovieMetadata
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieMetadata'

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1001
        username:
          type: string
          example: theUser
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: James
        email:
          type: string
          example: john@email.com
        password:
          type: string
          example: '12345'
        phone:
          type: string
          example: '12345'
        status:
          type: string
          description: User Status
          enum:
            - ACTIVE
            - INACTIVE
            - BANNED
            - DELETED
          default: ACTIVE
        role:
          type: string
          description: User Role
          enum:
            - USER
            - MANAGER
            - ADMIN
          default: USER
        createdAt:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00.000Z'
      xml:
        name: user

    UserArray:
      type: array
      items:
        $ref: '#/components/schemas/User'

    UserPage:
      type: object
      properties:
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
        totalPages:
          type: integer
          format: int32
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'

    Profile:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1001
        name:
          type: string
          example: 'Profile 1'
        avatar:
          type: string
          example: 'image.png'
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - LOCKED
          default: ACTIVE
        type:
          type: string
          enum:
            - DEFAULT
            - KIDS
            - ADULT
          default: DEFAULT
        password:
          type: string
        description:
          type: string
      xml:
        name: profile

    ProfileArray:
      type: array
      items:
        $ref: '#/components/schemas/Profile'

    Movie:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1001
        title:
          type: string
          example: 'Movie 1'
        year:
          type: integer
          format: int64
          example: 2024
        trailer:
          type: string
          example: 'ndl1W4ltcmg'
        rated:
          type: string
          example: 'PG-13'
        released:
          type: string
          example: '01/01/2024'
        runtime:
          type: string
          example: '143 min'
        genre:
          type: array
          items:
            type: string
        categories:
          type: string
        director:
          type: string
          example: 'jame'
        writer:
          type: string
          example: 'jame'
        actors:
          type: string
          example: 'jame'
        plot:
          type: string
          example: 'this is plot'
        languages:
          type: string
          example: 'EN, VI'
        country:
          type: string
          example: 'USA'
        awards:
          type: string
          example: 'there are awards'
        poster:
          type: string
          example: 'this is poster'
        nfFileId:
          type: integer
          format: int64
        metaScore:
          type: integer
          format: int64
          example: 69
        imdbRating:
          type: string
          example: '7.8'
        imdbVotes:
          type: integer
          format: int64
          example: 100000
        type:
          type: string
          example: 'movie'
        response:
          type: boolean
          example: true
        images:
          type: array
          items:
            type: string
      xml:
        name: movie

    MovieArray:
      type: array
      items:
        $ref: '#/components/schemas/Movie'

    MoviePage:
      type: object
      properties:
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
        totalPages:
          type: integer
          format: int32
        items:
          type: array
          items:
            $ref: '#/components/schemas/Movie'
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        type:
          type: string
        message:
          type: string
      xml:
        name: '##default'

    Config:
      type: object
      properties:
        id:
          type: integer
          format: int32
        config:
          type: string
          format: json
        active:
          type: boolean

    ConfigPage:
      type: object
      properties:
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
        totalPages:
          type: integer
          format: int32
        items:
          type: array
          items:
            $ref: '#/components/schemas/Config'

    MovieGenre:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        title:
          type: string
        description:
          type: string
        slug:
          type: string

    Metadata:
      type: object
      description: Movie Country
      properties:
        value:
          type: string
        description:
          type: string
        slug:
          type: string

    MovieMetadata:
      type: object
      properties:
        genres:
          type: array
          items:
            $ref: '#/components/schemas/Metadata'
        countries:
          type: array
          items:
            $ref: '#/components/schemas/Metadata'
        languages:
          type: array
          items:
            $ref: '#/components/schemas/Metadata'
        rated:
          type: array
          items:
            $ref: '#/components/schemas/Metadata'
