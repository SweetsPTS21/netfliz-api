spring.application.name=netfliz
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.port=8080
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# security
application.security.jwt.expiration=86400000
application.security.jwt.refresh-token.expiration=604800000
spring.graphql.cors.allowed-origins=*
spring.graphql.cors.allowed-methods=GET,POST, PUT, DELETE, OPTIONS
spring.graphql.cors.max-age=1800s
#Overriding bean definition
spring.main.allow-bean-definition-overriding=true
# Specify the Lucene Directory (in RAM for POC)
spring.jpa.properties.hibernate.search.default.directory_provider=local-heap
# multipart
spring.servlet.multipart.max-file-size=600MB
spring.servlet.multipart.max-request-size=600MB
# datasource
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect