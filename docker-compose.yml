# ============================================
# Netfliz API - Docker Compose Configuration
# ============================================
# Quick Start:
#   1. Copy .env.example to .env and configure
#   2. Run: docker-compose up -d
# ============================================

services:
  # ----------------------------------------
  # Main Application
  # ----------------------------------------
  netfliz-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: netfliz-api:latest
    container_name: netfliz-api
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - netfliz-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api-docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ----------------------------------------
  # PostgreSQL Database
  # ----------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: netfliz-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-netfliz}
      - POSTGRES_USER=${POSTGRES_USER:-netfliz}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-netfliz123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - netfliz-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netfliz} -d ${POSTGRES_DB:-netfliz}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------
  # Redis Cache
  # ----------------------------------------
  redis:
    image: redis:7-alpine
    container_name: netfliz-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-netfliz123}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - netfliz-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-netfliz123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

# ----------------------------------------
# Networks
# ----------------------------------------
networks:
  netfliz-network:
    driver: bridge

# ----------------------------------------
# Volumes (Persistent Storage)
# ----------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
