# ============================================
# Netfliz API - Docker Compose Configuration
# ============================================
# Quick Start:
#   1. Copy .env.example to .env and configure
#   2. Run: docker-compose up -d
# ============================================

services:
  # ----------------------------------------
  # Main Application
  # ----------------------------------------
  netfliz-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: netfliz-api:latest
    container_name: netfliz-api
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - netfliz-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api-docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# ----------------------------------------
# Networks
# ----------------------------------------
networks:
  netfliz-network:
    driver: bridge
